# Builds the app as a website that runs in the visitor's browser and publishes it on GitHub Pages.
# Runs automatically whenever something on the main branch changes, and can also be started by hand
# from the Actions tab ("Run workflow").

name: Publish app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publication at a time; a newer one replaces a running one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files from the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install marimo (fixed version, so a new release cannot break the site unexpectedly)
        run: pip install "marimo==0.25.2" uv

      - name: Build the website
        run: |
          marimo export html-wasm jp_search_terms.py -o _site --mode run
          rm -f _site/CLAUDE.md
          test -f _site/public/jmdict-en.json.gz || { echo "The dictionary file is missing from the website"; exit 1; }

      - name: Hand the website to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
